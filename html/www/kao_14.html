<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎表单</title>
</head>

<body>
请实现一个表单，包含姓名输入框与性别选择按钮。样式如下<br>
要求：<br>
姓名输入框的id与name属性值都为name。<br>
年龄输入框的id与name属性值都为age。<br>
性别按钮的name属性值为gender，id男为male女为female。<br>
实现函数 welcome，调用此函数后，实现如图所示的欢迎功能<br>
其中如果年龄大于等18岁，男性为'先生'，女性为'女士'<br>
其中如果年龄小于18岁，男性为'哥哥'，女性为'姐姐'<br>
显示欢迎信息的div的id为div_1<br>
此题请勿采用addEventListener或是oninput等方式来填充数据。<br>
<form>
    <label for="name">姓名:</label>
    <input type="text" id="name" name="name" placeholder="请输入姓名"><br>
    <label for="age">年龄:</label>
    <input type="number" id="age" name="age" placeholder="请输入年龄"><br>
    <label for="gender">性别:</label>
    <input type="radio" id="male" name="gender" value="男"> 男
    <input type="radio" id="female" name="gender" value="女"> 女
    <button type="button" onclick="welcome()">提交</button>
</form>
<div id="div_1"></div>
<script>
    function welcome() {
        var name = document.getElementById('name').value;
        var age = parseInt(document.getElementById('age').value);
        var gender = document.querySelector('input[name="gender"]:checked');
        if (gender) {
            gender = gender.value;
        }
        var title;
        if (age >= 18) {
            if (gender === '男') {
                title = '先生';
            } else {
                title = '女士';
            }
        } else {
            if (gender === '男') {
                title = '哥哥';
            } else {
                title = '姐姐';
            }
        }
        var welcomeMessage = `欢迎${name}${title}`;
        document.getElementById('div_1').innerHTML = welcomeMessage;
    }
</script>
</body>

</html>
