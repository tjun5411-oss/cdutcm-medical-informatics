Javascript基础编程<br>
要求如下：<br>
定义二维数组students<br>
存储如下数据：<br>
student_1:<br>
name:mike<br>
socre:96<br>
student_2:<br>
name:rose<br>
socre:95<br>
<body>
<script>
    var students=new Array();
    students["student_1"]=new Array();
    students["student_1"]["name"]="mike";
    students["student_1"]["score"]=96;
    students["student_2"]=new Array();
    students["student_2"]["name"]="rose";
    students["student_2"]["score"]=95;
</script>
</body>
