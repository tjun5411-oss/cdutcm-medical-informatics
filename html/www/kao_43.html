<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DIV布局</title>
    <style>
        #div_1 {
            position: relative;
            float: left;
            border: 1px solid red;
            height: 50px;
            width: 280px;
            display: flex;
        }

        #div_2 {
            position: relative;
            float: left;
            border: 1px solid red;
            height: 50px;
            width: 178px;
        }

        #div_3 {
            position: relative;
            float: left;
            border: 1px solid red;
            height: 50px;
            width:99;
        }
    </style>
</head>
按如下方式完成DIV布局。<br>

要求如下：<br>
三个div的id分别是div_1,div_2,div_3。<br>
所有div相对定位，左浮动,border都为1px,实线,红色。<br>
div_1的width为280px;div_2的width为178px。<br>
div_2与div_3要保持在同一水平线，且占满div_1的内部空间。<br>
<body>
<div id="div_1">
    <div id="div_2">div_2</div>
    <div id="div_3">div_3</div>
</div>
</body>
</html>
