<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>回调函数示例</title>
</head>
<body>
要求如下：<br>
定义函数main，实现回调。<br>
main函数接受两个参数。<br>
参数一为字符串，参数二为回调函数。<br>
回调时传参数一给回调函数。<br>
注：此题在提交时，请把自行测试时调用函数的代码行注释掉或是删除<br>
<input type="text" id="inputText" placeholder="输入字符串">
<button onclick="executeCallback()">触发回调</button>
<div id="output"></div>

<script>
    function main(str, callback) {
        if (typeof callback === 'function') {
            callback(str);
        }
    }
    function executeCallback() {
        const input = document.getElementById('inputText').value;
        main(input, function(message) {
            document.getElementById('output').textContent = '回调参数: ' + message;
        });
    }
</script>
</body>
</html>
