<body>定义一个myJson函数，带有一个形参，处理传过来的JSON形如{name:'mike',age:18,address:'chengdu'}，并返回name的值

<script>

    let myjson = {name:'mike',age:18,address:'chengdu'}

    function myJson(myjson) {

        var obj = eval('(' + myjson + ')')

        return obj.name

    }

    console.log(myJson(myjson));

</script>
