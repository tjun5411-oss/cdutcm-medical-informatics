Javascript基础编程<br>
要求如下：<br>

对象score请用var修饰。<br>
<body>
<script>
    var score={

            english:95,
            computer:96,
            math:97,},

        rose:{    //如果内容下面还有层次，直接加大括号就行
            english:93,
            computer:99,
            math:78,
        }
    }
</script>
