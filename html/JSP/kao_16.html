<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态添加文本框</title>
</head>
<body>
要求如下：<br>
通过自定义addInputBox函数实现。<br>
文本框的类型为text<br>
文本框的id为name,name为name，value为空。<br>
form表单的id为form_1，其它属性为默认<br>
注：此题在提交时，请把自行测试时调用函数的代码行注释掉或是删除<br>
<form id="form_1"></form>
<button onclick="addInputBox()">添加文本框</button>

<script>
    function addInputBox() {
        const form = document.getElementById('form_1');
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'name';
        input.name = 'name';
        input.value = '';
        form.appendChild(input);
    }
</script>
</body>
</html>
