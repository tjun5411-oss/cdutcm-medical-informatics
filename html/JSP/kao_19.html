<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数组操作示例</title>
</head>
<body>
要求如下：<br>
定义变量name,值为""。<br>
定义一维数组stu_1，有三个元素,其值依次为"mike",18,true。<br>
定义一维数组stu_2，有三个元素,其值依次为"rose",19,false。<br>
定义一维数组stu_3，有四个元素,其值依次为"tom",20,false,['c','javascript','springboot']。<br>
定义二维数组stus_1，有三个元素，其值依次为stu_1，stu_2，stu_3。<br>
<script>

    var name = "";


    var stu_1 = ["mike", 18, true];


    var stu_2 = ["rose", 19, false];

    var stu_3 = ["tom", 20, false, ['c', 'javascript', 'springboot']];


    var stus_1 = [stu_1, stu_2, stu_3];

    console.log("name:", name);
    console.log("stu_1:", stu_1);
    console.log("stu_2:", stu_2);
    console.log("stu_3:", stu_3);
    console.log("stus_1 (二维数组):", stus_1);
</script>
</body>
</html>
