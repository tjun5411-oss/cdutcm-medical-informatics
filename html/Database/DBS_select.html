    let currentChapter = 0;
    let userAnswers = {};
    let submitted = false;

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadChapter(currentChapter);
        updateProgressBar();
        updateChapterButtons();
    });

    // 加载章节
    function loadChapter(chapterIndex) {
        const chapter = chapters[chapterIndex];
        document.getElementById('current-chapter').textContent = chapterIndex + 1;

        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML = '';

        // 添加章节标题
        const chapterTitle = document.createElement('h2');
        chapterTitle.style.marginBottom = '20px';
        chapterTitle.style.color = '#1a2980';
        chapterTitle.textContent = chapter.title;
        contentDiv.appendChild(chapterTitle);

        // 添加题目
        chapter.questions.forEach((question, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-container';
            questionDiv.id = `question-${question.id}`;

            const questionHeader = document.createElement('div');
            questionHeader.className = 'question-header';

            const questionNumber = document.createElement('div');
            questionNumber.className = 'question-number';
            questionNumber.textContent = index + 1;

            const questionText = document.createElement('div');
            questionText.className = 'question-text';

            // 添加题目文本
            const textSpan = document.createElement('span');
            textSpan.innerHTML = question.text;
            questionText.appendChild(textSpan);

            // 如果是多选题，添加标记
            if (question.type === 'multi') {
                const multiTag = document.createElement('span');
                multiTag.className = 'multi-tag';
                multiTag.textContent = '多选题';
                questionText.appendChild(multiTag);
            }

            questionHeader.appendChild(questionNumber);
            questionHeader.appendChild(questionText);
            questionDiv.appendChild(questionHeader);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            question.options.forEach((option, optIndex) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const input = document.createElement('input');
                // 根据题目类型设置单选或多选
                input.type = question.type === 'multi' ? 'checkbox' : 'radio';
                input.name = question.id;
                input.value = String.fromCharCode(65 + optIndex);
                input.id = `${question.id}-opt-${optIndex}`;
                input.disabled = submitted;

                // 恢复用户答案
                if (userAnswers[question.id]) {
                    if (question.type === 'multi') {
                        // 多选题：检查当前选项是否在用户答案中
                        if (userAnswers[question.id].includes(input.value)) {
                            input.checked = true;
                        }
                    } else {
                        // 单选题
                        if (userAnswers[question.id] === input.value) {
                            input.checked = true;
                        }
                    }
                }

                const label = document.createElement('label');
                label.htmlFor = input.id;
                label.textContent = option;

                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionsDiv.appendChild(optionDiv);
            });

            questionDiv.appendChild(optionsDiv);

            // 答案区域
            const answerSection = document.createElement('div');
            answerSection.className = 'answer-section';
            answerSection.id = `answer-${question.id}`;

            const correctAnswer = document.createElement('div');
            correctAnswer.className = 'correct-answer';
            correctAnswer.textContent = `正确答案: ${question.answer}`;

            const userAnswer = document.createElement('div');
            userAnswer.className = 'user-answer';
            userAnswer.id = `user-answer-${question.id}`;
            userAnswer.textContent = '您的答案: 未回答';

            answerSection.appendChild(correctAnswer);
            answerSection.appendChild(userAnswer);

            if (submitted) {
                answerSection.style.display = 'block';

                // 显示用户答案
                if (userAnswers[question.id]) {
                    userAnswer.textContent = `您的答案: ${userAnswers[question.id]}`;

                    // 标记错误答案
                    if (userAnswers[question.id] !== question.answer) {
                        questionDiv.classList.add('incorrect');
                    }
                }
            }

            questionDiv.appendChild(answerSection);
            contentDiv.appendChild(questionDiv);
        });

        // 重置提交状态
        submitted = false;
        document.getElementById('result-summary').style.display = 'none';
        document.getElementById('submit-btn').textContent = '提交答案';
        document.getElementById('submit-btn').disabled = false;
    }

    // 提交答案
    function submitAnswers() {
        const chapter = chapters[currentChapter];
        let correctCount = 0;

        // 收集答案并验证
        chapter.questions.forEach(question => {
            let userAnswer = '';

            if (question.type === 'multi') {
                // 处理多选题
                const checkedBoxes = document.querySelectorAll(`input[name="${question.id}"]:checked`);
                if (checkedBoxes.length > 0) {
                    // 将选中的值按字母顺序排序
                    userAnswer = Array.from(checkedBoxes)
                        .map(box => box.value)
                        .sort()
                        .join('');
                }
            } else {
                // 处理单选题
                const selectedOption = document.querySelector(`input[name="${question.id}"]:checked`);
                if (selectedOption) {
                    userAnswer = selectedOption.value;
                }
            }

            // 保存用户答案
            userAnswers[question.id] = userAnswer || '未回答';

            // 显示答案区域
            const answerSection = document.getElementById(`answer-${question.id}`);
            answerSection.style.display = 'block';

            // 显示用户答案
            const userAnswerElement = document.getElementById(`user-answer-${question.id}`);
            userAnswerElement.textContent = `您的答案: ${userAnswers[question.id]}`;

            // 标记错误答案
            const questionDiv = document.getElementById(`question-${question.id}`);
            if (userAnswers[question.id] === question.answer) {
                correctCount++;
            } else {
                questionDiv.classList.add('incorrect');
            }
        });

        submitted = true;

        // 禁用所有输入框
        document.querySelectorAll('input').forEach(input => {
            input.disabled = true;
        });

        // 更新提交按钮
        document.getElementById('submit-btn').textContent = '已提交';
        document.getElementById('submit-btn').disabled = true;

        // 显示结果摘要
        const resultSummary = document.getElementById('result-summary');
        const scoreDiv = document.getElementById('score');
        const accuracyDiv = document.getElementById('accuracy');
        const resultMessage = document.getElementById('result-message');

        scoreDiv.textContent = `${correctCount}/${chapter.questions.length}`;
        const accuracy = Math.round((correctCount / chapter.questions.length) * 100);
        accuracyDiv.textContent = accuracy;

        if (accuracy >= 80) {
            resultMessage.textContent = "太棒了！您对本章内容掌握得很好！";
            resultMessage.style.color = "#2ecc71";
        } else if (accuracy >= 60) {
            resultMessage.textContent = "不错！再复习一下可以做得更好！";
            resultMessage.style.color = "#f39c12";
        } else {
            resultMessage.textContent = "需要加强学习，建议复习本章内容后再试一次。";
            resultMessage.style.color = "#e74c3c";
        }

        resultSummary.style.display = 'block';

        // 滚动到结果区域
        resultSummary.scrollIntoView({ behavior: 'smooth' });
    }

    // 切换章节
    function changeChapter(direction) {
        const newChapter = currentChapter + direction;

        if (newChapter >= 0 && newChapter < chapters.length) {
            currentChapter = newChapter;
            loadChapter(currentChapter);
            updateProgressBar();
            updateChapterButtons();

            // 滚动到顶部
            document.getElementById('content').scrollTop = 0;
        }
    }

    // 更新进度条
    function updateProgressBar() {
        const progress = ((currentChapter + 1) / chapters.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    // 更新章节按钮状态
    function updateChapterButtons() {
        document.getElementById('prev-chapter').disabled = currentChapter === 0;
        document.getElementById('next-chapter').disabled = currentChapter === chapters.length - 1;

        if (currentChapter === chapters.length - 1) {
            document.getElementById('next-chapter').textContent = '最后一章';
        } else {
            document.getElementById('next-chapter').textContent = '下一章';
        }
    }
</script>
