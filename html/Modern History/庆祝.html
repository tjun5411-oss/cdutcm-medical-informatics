<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程结业 - 登顶成功</title>
    <style>
        :root {
            --accent: #FFD700;
            --premium-bg: #0A0A0B;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--premium-bg);
            color: #fff;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* 顶部环境光 */
        .ambient-light {
            position: absolute; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(212, 172, 13, 0.12) 0%, transparent 70%);
            border-radius: 50%; top: -15%; right: -10%; z-index: 0;
            pointer-events: none;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        .main-container {
            position: relative; z-index: 10;
            height: 100vh; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }

        /* 3D 动态勋章 */
        .badge-wrapper {
            position: relative; width: 220px; height: 220px;
            margin-bottom: 40px; display: flex; align-items: center; justify-content: center;
            pointer-events: auto;
        }

        .badge-outer {
            position: absolute; width: 100%; height: 100%;
            border: 3px solid var(--accent); border-radius: 50%;
            border-top-color: transparent; border-bottom-color: transparent;
            animation: spin 6s linear infinite;
        }

        .badge-inner {
            position: absolute; width: 80%; height: 80%;
            border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 50%;
            animation: spinRev 4s linear infinite;
        }

        .badge-icon {
            font-size: 90px; filter: drop-shadow(0 0 30px var(--accent));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* 中文极简排版 */
        .hero-text { text-align: center; margin-bottom: 40px; }
        .hero-text h1 {
            font-size: 4rem; font-weight: 800;
            margin: 0; letter-spacing: 12px;
            background: linear-gradient(to bottom, #fff 40%, #D4AC0D 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .hero-text p {
            font-size: 1.1rem; color: #888;
            letter-spacing: 6px; margin-top: 15px; font-weight: 300;
        }

        /* 数字化成就面板 */
        .dashboard {
            display: flex; gap: 40px; margin-bottom: 60px; pointer-events: auto;
        }

        .data-node {
            background: var(--glass); border: 1px solid var(--border);
            padding: 25px 45px; border-radius: 8px;
            backdrop-filter: blur(12px); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .data-node:hover {
            border-color: var(--accent); transform: scale(1.05);
            box-shadow: 0 0 30px rgba(212, 172, 13, 0.15);
        }
        .data-label { font-size: 0.8rem; color: #777; margin-bottom: 8px; font-weight: 500; }
        .data-value { font-size: 1.6rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }

        /* 高级行动按钮 */
        .cta-button {
            background: rgba(255, 215, 0, 0.05); border: 1px solid var(--accent);
            color: var(--accent); padding: 18px 55px;
            text-decoration: none; font-weight: 600;
            letter-spacing: 3px; font-size: 1rem;
            transition: 0.4s; position: relative; border-radius: 2px;
            cursor: pointer; pointer-events: auto;
        }
        .cta-button:hover {
            background: var(--accent); color: #000;
            box-shadow: 0 0 40px rgba(212, 172, 13, 0.5);
            letter-spacing: 5px;
        }

        /* 动画控制 */
        .reveal { opacity: 0; animation: revealUp 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(50px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.9s; }

    </style>
</head>
<body>

<div class="ambient-light"></div>
<canvas id="fireworksCanvas"></canvas>

<div class="main-container">
    <div class="badge-wrapper reveal">
        <div class="badge-outer"></div>
        <div class="badge-inner"></div>
        <div class="badge-icon">⚜️</div>
    </div>

    <div class="hero-text reveal delay-1">
        <h1>任务达成</h1>
        <p>中国近现代史纲要 · 知识图谱已更新</p>
    </div>

    <div class="dashboard reveal delay-2">
        <div class="data-node">
            <div class="data-label">课程进度</div>
            <div class="data-value">结业归档</div>
        </div>
        <div class="data-node">
            <div class="data-label">掌握程度</div>
            <div class="data-value">卓越级别</div>
        </div>
        <div class="data-node">
            <div class="data-label">学术证书</div>
            <div class="data-value">已授权</div>
        </div>
    </div>

    <div class="reveal delay-3">
        <a href="index.html" class="cta-button">返回首页</a>
    </div>
</div>

<script>
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(x, y, color, speed, angle) {
            this.x = x; this.y = y;
            this.color = color;
            this.velocityX = Math.cos(angle) * speed;
            this.velocityY = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.01 + 0.005; // 稍慢的消失
            this.lineWidth = 3.5; // 加粗线条
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            // 绘制带发光效果的火花线条
            ctx.lineWidth = this.lineWidth;
            ctx.lineCap = 'round';
            ctx.strokeStyle = this.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.velocityX * 3, this.y - this.velocityY * 3);
            ctx.stroke();
            ctx.restore();
        }

        update() {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.velocityY += 0.08; // 真实重力感
            this.alpha -= this.decay;
            if(this.lineWidth > 0.1) this.lineWidth -= 0.05;
        }
    }

    function spawnFirework(x, y) {
        // 商业级配色方案：金黄、银白、琥珀色
        const palettes = ['#FFD700', '#FFFFFF', '#FFA500', '#F0E68C'];
        const baseColor = palettes[Math.floor(Math.random() * palettes.length)];
        const particleCount = 80;

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 10 + 2;
            particles.push(new Particle(x, y, baseColor, speed, angle));
        }
    }

    function render() {
        // 保持较长的拖尾感
        ctx.fillStyle = 'rgba(10, 10, 11, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (Math.random() < 0.04) {
            spawnFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.4);
        }

        particles.forEach((p, i) => {
            if (p.alpha > 0) {
                p.update();
                p.draw();
            } else {
                particles.splice(i, 1);
            }
        });
        requestAnimationFrame(render);
    }

    render();

    // 允许手动点击施放华丽烟花
    window.addEventListener('mousedown', (e) => {
        for(let i=0; i<3; i++) {
            setTimeout(() => {
                spawnFirework(e.clientX + (Math.random()-0.5)*100, e.clientY + (Math.random()-0.5)*100);
            }, i * 150);
        }
    });
</script>
</body>
</html>
