        const wrapper = document.getElementById('sections-wrapper');

        for (let s = 0; s < totalSections; s++) {
            const start = s * itemsPerPage;
            const end = Math.min(start + itemsPerPage, questions.length);

            // 创建容器
            const sectionContainer = document.createElement('div');
            sectionContainer.className = 'section-container';

            // 标题
            const title = document.createElement('h2');
            title.className = 'section-title';
            title.textContent = `第 ${s + 1} 部分：题目 (${start + 1}-${end})`;
            sectionContainer.appendChild(title);

            // 题目列表
            const qList = document.createElement('div');
            qList.id = `q-list-${s}`;

            for (let i = start; i < end; i++) {
                qList.appendChild(createQuestionElement(questions[i], i));
            }
            sectionContainer.appendChild(qList);

            // 按钮组
            const btnGroup = document.createElement('div');
            btnGroup.className = 'section-buttons';
            btnGroup.innerHTML = `
                <button class="section-btn reset-section-btn" onclick="resetGroup(${s}, ${start}, ${end})">重置本组</button>
                <button class="section-btn submit-section-btn" onclick="submitGroup(${s}, ${start}, ${end})">提交本组答案</button>
            `;
            sectionContainer.appendChild(btnGroup);

            wrapper.appendChild(sectionContainer);
        }
    }

    function createQuestionElement(q, index) {
        const div = document.createElement('div');
        div.className = 'question-item';
        div.id = `q-item-${index}`;

        const optionsHtml = q.options.map((opt, optIdx) => `
            <label class="option" id="label-${index}-${optIdx}">
                <input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q-${index}" value="${optIdx}">
                ${opt}
            </label>
        `).join('');

        div.innerHTML = `
            <div class="question-header">
                <div class="question-number">第${index + 1}题</div>
                <span class="question-type ${q.type === 'single' ? 'single-choice' : 'multiple-choice'}">
                    ${q.type === 'single' ? '单选题' : '多选题'}
                </span>
            </div>
            <div class="question-text">${q.text}</div>
            <div class="options-container">${optionsHtml}</div>
            <div class="feedback" id="feedback-${index}"></div>
        `;

        // 绑定点击样式
        div.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', function() {
                if(q.type === 'single') {
                    div.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                }
                if(this.checked) this.parentElement.classList.add('selected');
                else this.parentElement.classList.remove('selected');
            });
        });

        return div;
    }

    window.submitGroup = function(sectionIdx, start, end) {
        let correctCount = 0; // 新增：用于统计正确题数
        let totalCount = end - start; // 新增：本组总题数

        for (let i = start; i < end; i++) {
            const q = questions[i];
            const item = document.getElementById(`q-item-${i}`);
            const feedback = document.getElementById(`feedback-${i}`);
            const inputs = document.getElementsByName(`q-${i}`);

            let selected = [];
            inputs.forEach((input, idx) => { if(input.checked) selected.push(idx); });

            let isCorrect = false;
            if(q.type === 'single') {
                isCorrect = selected.length === 1 && selected[0] == q.answer;
            } else {
                isCorrect = JSON.stringify(selected.sort()) === JSON.stringify(q.answer.sort());
            }

            // 新增：如果正确，计数器加1
            if (isCorrect) correctCount++;

            // 更新样式
            item.classList.remove('correct', 'incorrect');
            item.classList.add(isCorrect ? 'correct' : 'incorrect');

            // 显示反馈
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            const correctText = Array.isArray(q.answer)
                ? q.answer.map(a => String.fromCharCode(65 + a)).join(', ')
                : String.fromCharCode(65 + q.answer);

            feedback.innerHTML = `
                <div class="feedback-title">${isCorrect ? '回答正确' : '回答错误'}</div>
                <div class="correct-answer-text">正确答案：${correctText}</div>
                <div class="explanation"><strong>解析：</strong>${q.explanation}</div>
            `;
        }

        // 新增：弹出统计提示
        alert(`本部分练习已完成！\n\n共计：${totalCount} 题\n正确：${correctCount} 题\n错误：${totalCount - correctCount} 题`);
    };

    window.resetGroup = function(sectionIdx, start, end) {
        for (let i = start; i < end; i++) {
            const item = document.getElementById(`q-item-${i}`);
            item.classList.remove('correct', 'incorrect');
            const inputs = document.getElementsByName(`q-${i}`);
            inputs.forEach(input => {
                input.checked = false;
                input.parentElement.classList.remove('selected');
            });
            document.getElementById(`feedback-${i}`).className = 'feedback';
        }
    };

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
