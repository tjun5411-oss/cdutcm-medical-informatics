        { type: "single", text: "新文化运动前期，陈独秀等人将“民主”与“科学”作为批判传统伦理的核心武器，其潜在的叙事逻辑是", options: ["A. 通过文化复古来拯救民族危亡", "B. 将中国问题的总根源归结为思想文化，并试图以西方现代性价值进行整体置换", "C. 认为经济制度的变革是解决一切社会问题的前提", "D. 号召通过政治革命直接建立资产阶级共和国"], answer: 1, explanation: "新文化运动主张从思想深处改造国民，通过引入西方的民主（德先生）和科学（赛先生）来解决中国问题。" },

        { type: "single", text: "五四运动后，知识分子中出现的“到民间去”的社会思潮，其实质是", options: ["A. 民粹主义对精英主义的否定", "B. 知识分子对“士大夫”传统角色的自我超越，寻求与工农结合", "C. 一种新型的乡村建设运动", "D. 对工业化的反思"], answer: 1, explanation: "这标志着中国先进知识分子开始关注底层劳工，是马克思主义与工人运动结合的开端。" },

        { type: "single", text: "新文化运动初期批判儒家思想的根本意图是", options: ["A. 否定所有传统", "B. 引进马克思主义", "C. 批判作为封建专制制度思想基础的纲常名教", "D. 文学革命"], answer: 2, explanation: "只有摧毁封建思想根基，民主共和才能稳固。" },
        { type: "single", text: "五四运动前的新文化运动最主要功绩是", options: ["A. 动摇了封建思想统治地位，形成思想解放潮流", "B. 传播马克思主义", "C. 促成中共成立", "D. 找到正确道路"], answer: 0, explanation: "它开启了中国近现代史上的一次重大的思想启蒙。" },
        { type: "single", text: "五四运动直接目标实现，说明了", options: ["A. 北洋政府顺应民意", "B. 工人阶级作为独立政治力量登上舞台显示了威力", "C. 帝国主义政策转变", "D. 学生先锋作用"], answer: 1, explanation: "工人阶级的加入是运动取得最后胜利的关键力量。" },
        { type: "single", text: "五四运动后期，运动中心和形式的变化是", options: ["A. 从北京到上海，从学生到工商业者", "B. 从上海到北京", "C. 从北京到广州", "D. 从城市到农村"], answer: 0, explanation: "中心由北京转往上海，力量重心由学生转往工人。" },

        { type: "single", text: "中共一大确定的党成立后的中心任务是", options: ["A. 农民运动", "B. 组织工人阶级，领导工人运动", "C. 统一战线", "D. 军事斗争"], answer: 1, explanation: "早期党被定位为工人的政党。" },
        { type: "single", text: "巴黎和会中国外交失败的深层背景是", options: ["A. 官员无能", "B. 帝国主义强权政治和中国的弱国地位", "C. 日本侵略", "D. 民族觉醒"], answer: 1, explanation: "“弱国无外交”是失败的本质原因。" },

        { type: "single", text: "1920年，中国第一个共产党早期组织成立于", options: ["A. 北京", "B. 上海", "C. 长沙", "D. 广州"], answer: 1, explanation: "陈独秀在上海建立了中国第一个共产党组织。" },
        { type: "single", text: "中共一大决定首先集中精力", options: ["A. 农民运动", "B. 学生运动", "C. 工人运动", "D. 军事斗争"], answer: 2, explanation: "这是由党的阶级性质决定的初期重心。" },

        // 31-42
        { type: "single", text: "陈独秀在新文化运动初期被誉为“明星”，其核心主张是", options: ["A. 提倡民主与科学", "B. 白话文", "C. 马克思主义", "D. 无产阶级革命"], answer: 0, explanation: "陈独秀是新文化运动的旗手，最早高举民主科学大旗。" },
        { type: "single", text: "“十月革命一声炮响，送来了马列主义”主要强调", options: ["A. 唯一来源", "B. 成功实践使中国先进分子看到了新希望", "C. 著作来自俄国", "D. 共产国际帮助"], answer: 1, explanation: "十月革命证明了马克思主义能够成功解决落后国家的命运问题。" },

        { type: "single", text: "中共成立后的“新”主要指", options: ["A. 马克思主义指导", "B. 民主革命纲领", "C. 以共产主义为目标、工人阶级为基础", "D. 以上全是"], answer: 3, explanation: "这是中国历史上前所未有的新型革命政党。" },
        { type: "single", text: "一战后，对中国民族工业起到促进作用的是", options: ["A. 清政府放宽限制", "B. 辛亥革命", "C. 帝国主义暂时放松了对中国的经济侵略", "D. 群众斗争"], answer: 2, explanation: "西方列强忙于一战，给中国民族工业带来了“黄金时代”。" },
        { type: "single", text: "五四运动标志着新民主主义革命开端，主因是", options: ["A. 十月革命后", "B. 外争国权口号", "C. 无产阶级开始作为独立政治力量登上舞台", "D. 学生发起"], answer: 2, explanation: "领导力量的变化决定了革命性质的变化。" },
        { type: "single", text: "陈独秀被誉为“总司令”，是因为他", options: ["A. 游行示威", "B. 创办《新青年》，发起新文化运动", "C. 最早宣传马主义", "D. 创始人"], answer: 1, explanation: "他在思想发动上起到了决定性作用。" },
        { type: "single", text: "早期论战的意义在于", options: ["A. 肃清错误思想", "B. 扩大了马克思主义的思想阵地，推动了传播", "C. 绝对统治", "D. 国共合作基础"], answer: 1, explanation: "马克思主义是在不断的辩论和斗争中赢得影响力的。" },

        // 多选题 1-10
        { type: "multiple", text: "新文化运动前期呈现的局限性体现在", options: ["A. 民主的形式化", "B. 科学范围狭窄", "C. 绝对肯定或否定的偏向", "D. 局限于知识分子", "E. 儒学与孔教混淆"], answer: [0, 1, 2, 3, 4], explanation: "新文化运动虽伟大，但存在脱离群众和思想偏激等问题。" },
        { type: "multiple", text: "五四运动的复杂性和多层次性体现在", options: ["A. 爱国/思想解放结合", "B. 外交/反帝反封建主题", "C. 参与主体扩展", "D. 革命转折点", "E. 长远影响"], answer: [0, 1, 2, 3, 4], explanation: "五四运动是一场全方位的影响深远的运动。" },
        { type: "multiple", text: "马克思主义最终被中国先进分子选择是因为", options: ["A. 提供了科学的世界观", "B. 苏俄放弃不平等条约", "C. 阶级基础", "D. 改良主义失败", "E. 传统契合点"], answer: [0, 1, 2, 3, 4], explanation: "马克思主义符合中国救亡图存的迫切需求。" },
        { type: "multiple", text: "中共早期组织的活动重点包括", options: ["A. 思想论战", "B. 工人宣传组织", "C. 探讨理论应用", "D. 严格遵循指示（误）", "E. 培养后备力量"], answer: [0, 1, 2, 4], explanation: "D选项错误，虽然受国际影响，但早期已开始有自主探索。" },
        { type: "multiple", text: "中共一大的局限性包括", options: ["A. 确立最高目标", "B. 未认识到农民和武装斗争重要性", "C. 策略局限（断绝一切联系）", "D. 组织纪律严明", "E. 纲领待具体化"], answer: [1, 2, 4], explanation: "A和D是优点而非局限。局限性在于未区分民主革命阶段任务。" },
        { type: "multiple", text: "陈独秀的思想演变轨迹包括", options: ["A. 文化启蒙转向政治革命", "B. 民主主义转向马克思主义", "C. 不谈政治转向投身斗争", "D. 建立权威但也埋下家长制隐患", "E. 始终反对合作（误）"], answer: [0, 1, 2, 3], explanation: "陈独秀后来是促成国共合作的关键人物，E错误。" },
        { type: "multiple", text: "五四后知识分子的去向包括", options: ["A. 马克思主义革命", "B. 自由主义改良", "C. 回归书斋", "D. 基尔特社会主义", "E. 无政府主义"], answer: [0, 1, 2, 3, 4], explanation: "反映了当时思想界的多元与剧变。" },
        { type: "multiple", text: "“问题与主义”之争的影响在于", options: ["A. 社会改造道路之争", "B. 阵营分裂", "C. 注重理论联系实际", "D. 扩大马主义影响", "E. 彻底解决分歧（误）"], answer: [0, 1, 2, 3], explanation: "E选项太绝对，分歧并未通过论战彻底消除。" },
        { type: "multiple", text: "中共成立的“必然性”体现包括", options: ["A. 思想基础", "B. 阶级基础", "C. 干部基础", "D. 外部条件", "E. 此前失败的教训"], answer: [0, 1, 2, 3, 4], explanation: "中共的诞生是近代中国社会矛盾发展的必然结果。" },
        { type: "multiple", text: "中共成立使中国革命面貌“焕然一新”的内涵包括", options: ["A. 新领导力量", "B. 新指导思想", "C. 新革命纲领", "D. 新革命方法", "E. 新国际背景"], answer: [0, 1, 2, 3, 4], explanation: "这五点共同构成了“焕然一新”的实质内容。" }
    ];

    const sections = [
        { start: 0, end: 10, title: "第一部分：单项选择题 (1-10)" },
        { start: 10, end: 20, title: "第二部分：单项选择题 (11-20)" },
        { start: 20, end: 30, title: "第三部分：单项选择题 (21-30)" },
        { start: 30, end: 42, title: "第四部分：单项选择题 (31-42)" },
        { start: 42, end: 52, title: "第五部分：多项选择题 (1-10)" }
    ];

    let userAnswers = new Array(questions.length).fill(null);

    document.addEventListener('DOMContentLoaded', () => {
        const quizContainer = document.getElementById('quiz-sections');
        sections.forEach((sec, sIdx) => {
            const secDiv = document.createElement('div');
            secDiv.className = 'section-container';
            secDiv.innerHTML = `<h2 class="section-title">${sec.title}</h2><div id="sec-qs-${sIdx}"></div>`;

            const btnDiv = document.createElement('div');
            btnDiv.className = 'section-buttons';
            btnDiv.innerHTML = `
                <button class="section-btn reset-section-btn" onclick="resetSec(${sIdx})">重置本节</button>
                <button class="section-btn submit-section-btn" onclick="submitSec(${sIdx})">提交并查看解析</button>
            `;
            secDiv.appendChild(btnDiv);
            quizContainer.appendChild(secDiv);

            const qsDiv = secDiv.querySelector(`#sec-qs-${sIdx}`);
            for (let i = sec.start; i < sec.end; i++) {
                qsDiv.appendChild(createQElement(questions[i], i));
            }
        });
    });

    function createQElement(q, i) {
        const div = document.createElement('div');
        div.className = 'question-item';
        div.id = `q-item-${i}`;
        div.innerHTML = `
            <div class="question-header">
                <span class="question-number">第${q.type==='multiple' ? i-41 : i+1}题</span>
                <span class="question-type ${q.type==='single'?'single-choice':'multiple-choice'}">${q.type==='single'?'单选':'多选'}</span>
            </div>
            <div class="question-text">${q.text}</div>
            <div class="options-container">
                ${q.options.map((opt, oIdx) => `
                    <div class="option" onclick="toggleOpt(${i}, ${oIdx})">
                        <input type="${q.type==='single'?'radio':'checkbox'}" name="q${i}" id="q${i}o${oIdx}">
                        <label>${opt}</label>
                    </div>
                `).join('')}
            </div>
            <div class="feedback" id="fb-${i}"></div>
        `;
        return div;
    }

    function toggleOpt(qIdx, oIdx) {
        const q = questions[qIdx];
        const item = document.getElementById(`q-item-${qIdx}`);
        const checkbox = document.getElementById(`q${qIdx}o${oIdx}`);

        if (q.type === 'single') {
            userAnswers[qIdx] = oIdx;
            item.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            item.querySelectorAll('input').forEach(input => input.checked = false);
            checkbox.checked = true;
        } else {
            // 多选题：初始化数组并确保勾选状态同步
            if (!Array.isArray(userAnswers[qIdx])) userAnswers[qIdx] = [];

            const pos = userAnswers[qIdx].indexOf(oIdx);
            if (pos > -1) {
                userAnswers[qIdx].splice(pos, 1);
                checkbox.checked = false;
            } else {
                userAnswers[qIdx].push(oIdx);
                checkbox.checked = true;
            }
        }
        item.querySelectorAll('.option')[oIdx].classList.toggle('selected');
    }

    function submitSec(sIdx) {
        const sec = sections[sIdx];
        let correctCount = 0;
        let totalCount = sec.end - sec.start;

        for (let i = sec.start; i < sec.end; i++) {
            const q = questions[i];
            let isCorrect = false;
            const uAns = userAnswers[i];

            if (q.type === 'single') {
                isCorrect = uAns === q.answer;
            } else {
                // 稳健的比对逻辑：确保用户选的项和答案项完全匹配
                const safeUserAns = Array.isArray(uAns) ? uAns : [];
                isCorrect = safeUserAns.length === q.answer.length &&
                    safeUserAns.every(val => q.answer.includes(val)) &&
                    q.answer.every(val => safeUserAns.includes(val));
            }

            if (isCorrect) correctCount++;

            const fb = document.getElementById(`fb-${i}`);
            const item = document.getElementById(`q-item-${i}`);
            item.className = `question-item ${isCorrect ? 'correct' : 'incorrect'}`;
            fb.style.display = 'block';
            fb.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;

            // 格式化解析显示
            const answerText = q.type === 'single'
                ? q.options[q.answer]
                : q.answer.sort((a,b)=>a-b).map(idx => String.fromCharCode(65 + idx)).join('');

            fb.innerHTML = `
                <div style="font-weight:bold">${isCorrect ? '✅ 正确' : '❌ 错误'}</div>
                <div class="correct-answer">正确答案：${answerText}</div>
                <div class="explanation"><strong>解析：</strong>${q.explanation}</div>
            `;
        }

        alert(`本节练习完成！\n正确：${correctCount} 道\n错误：${totalCount - correctCount} 道\n得分率：${((correctCount/totalCount)*100).toFixed(1)}%`);
    }

    function resetSec(sIdx) {
        const sec = sections[sIdx];
        for (let i = sec.start; i < sec.end; i++) {
            userAnswers[i] = null;
            const item = document.getElementById(`q-item-${i}`);
            item.className = 'question-item';
            item.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            item.querySelectorAll('input').forEach(input => input.checked = false);
            document.getElementById(`fb-${i}`).style.display = 'none';
        }
    }
</script>
</body>
</html>
