    { q: "54. 《共同纲领》未能明确规定社会主义前途的现实原因是", a: 1, type: "single", opts: ["A. 尚未确立理想", "B. 团结各阶级完成新民主主义革命遗留任务", "C. 苏联影响", "D. 理论分歧"] },
    { q: "55. “紫石英号事件”宣告了", a: 1, type: "single", opts: ["A. 国际支持", "B. 列强“炮舰政策”在中国已经一去不复返", "C. 海军强大", "D. 一边倒"] },
    { q: "56. 美国“扶蒋反共”却“力不从心”的根源在于", a: 1, type: "single", opts: ["A. 国内舆论", "B. 国民党政权的腐败无能使其成为“扶不起的阿斗”", "C. 苏联警告", "D. 重心在欧"] },
    { q: "57. 建立起广泛统一战线的关键前提是", a: 2, type: "single", opts: ["A. 经济援助", "B. 军事优势", "C. 政策和行动代表了最广大人民根本利益", "D. 政治让步"] },
    { q: "58. 国民党军事迅速溃败最致命的内部因素是", a: 1, type: "single", opts: ["A. 装备落后", "B. 派系林立，指挥混乱，士气低落", "C. 失去美援", "D. 战术失误"] },
    { q: "59. “纸老虎”论断的认识论基础是", a: 0, type: "single", opts: ["A. 辩证唯物主义与历史唯物主义", "B. 革命英雄主义", "C. 战斗力评估", "D. 国际形势"] },
    { q: "60. 新中国的国体和政体分别是", a: 0, type: "single", opts: ["A. 人民民主专政；民主集中制的人代会制度", "B. 无产阶级专政；政协制度", "C. 联合专政；三权分立", "D. 社会主义共和国；苏维埃"] },

    // 多选 1-5
    { q: "1. 抗日战争胜利后，中共争取和平民主的战略意义举措包括", a: [0, 1, 2, 3], type: "multiple", opts: ["A. 毛泽东赴重庆谈判", "B. 让出南方八个解放区", "C. “向北发展，向南防御”", "D. 大规模练兵生产做好准备", "E. 拒绝军队国家化"] },
    { q: "2. 《中国土地法大纲》相较于抗战时期政策的转变体现为", a: [0, 1, 2, 4], type: "multiple", opts: ["A. 废除剥削，实行耕者有其田", "B. 按人口平分土地", "C. 调动农民参军支前", "D. 保护富农经济", "E. 获得农民支持"] },
    { q: "3. 战略进攻阶段后，中共采取的关键战略决策有", a: [0, 1, 2, 4], type: "multiple", opts: ["A. 千里跃进大别山", "B. 发布“五一口号”", "C. 发动三大战役", "D. 国统区学生运动", "E. 提出“打倒蒋介石，解放全中国”"] },
    { q: "4. 反蒋第二条战线形成的社会根源在于", a: [0, 1, 2, 3, 4], type: "multiple", opts: ["A. 通胀恶化民生", "B. 独裁镇压", "C. 知识分子关怀", "D. 中共组织领导", "E. 民族资产阶级放弃幻想"] },
    { q: "5. 解放战争胜利的深刻历史经验包括", a: [0, 1, 2, 3, 4], type: "multiple", opts: ["A. 广泛统一战线", "B. 党领导的人民军队", "C. 反对帝国主义", "D. 加强党的建设", "E. 马克思主义中国化"] }
  ];

  const sections = [
    { title: "单选 1-20：战后博弈与内战爆发", start: 0, end: 20 },
    { title: "单选 21-40：土地改革与第二条战线", start: 20, end: 40 },
    { title: "单选 41-60：战略决战与新中国雏形", start: 40, end: 60 },
    { title: "多项选择题：历史经验总结", start: 60, end: 65 }
  ];

  let userAnswers = new Array(questions.length).fill(null);

  function init() {
    const container = document.getElementById('quiz-app');
    sections.forEach((sec, sIdx) => {
      const secDiv = document.createElement('div');
      secDiv.className = 'section-container';
      secDiv.innerHTML = `<h2 class="section-title"><i class="fas fa-star"></i> ${sec.title}</h2><div id="sec-${sIdx}"></div>`;

      const btnDiv = document.createElement('div');
      btnDiv.className = 'btn-group';
      btnDiv.innerHTML = `
                <button class="btn btn-reset" onclick="resetSection(${sIdx})">重置本节</button>
                <button class="btn btn-submit" onclick="submitSection(${sIdx})">校对本节</button>
            `;
      secDiv.appendChild(btnDiv);
      container.appendChild(secDiv);

      const qBox = secDiv.querySelector(`#sec-${sIdx}`);
      for (let i = sec.start; i < sec.end; i++) {
        qBox.appendChild(createQ(i));
      }
    });
  }

  function createQ(idx) {
    const q = questions[idx];
    const div = document.createElement('div');
    div.className = 'question-item';
    div.id = `q-box-${idx}`;

    div.innerHTML = `
            <div class="question-header">
                <span class="question-number">第 ${idx < 60 ? idx + 1 : idx - 59} 题</span>
                <span class="question-type ${q.type}-choice">${q.type === 'single' ? '单选' : '多选'}</span>
            </div>
            <div class="question-text">${q.q}</div>
            <div class="options-container">
                ${q.opts.map((o, oi) => `
                    <div class="option" onclick="handleSel(${idx}, ${oi})">
                        <input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q${idx}" id="q${idx}o${oi}">
                        <label>${o}</label>
                    </div>
                `).join('')}
            </div>
            <div class="feedback" id="fb-${idx}"></div>
        `;
    return div;
  }

  function handleSel(qi, oi) {
    const q = questions[qi];
    const container = document.getElementById(`q-box-${qi}`);
    const inputs = container.querySelectorAll('input');
    const opts = container.querySelectorAll('.option');

    if (q.type === 'single') {
      userAnswers[qi] = oi;
      opts.forEach(o => o.classList.remove('selected'));
      opts[oi].classList.add('selected');
      inputs[oi].checked = true;
    } else {
      if (!userAnswers[qi]) userAnswers[qi] = [];
      const pos = userAnswers[qi].indexOf(oi);
      if (pos > -1) {
        userAnswers[qi].splice(pos, 1);
        opts[oi].classList.remove('selected');
        inputs[oi].checked = false;
      } else {
        userAnswers[qi].push(oi);
        opts[oi].classList.add('selected');
        inputs[oi].checked = true;
      }
    }
  }

  function submitSection(sIdx) {
    const sec = sections[sIdx];
    let score = 0;
    for (let i = sec.start; i < sec.end; i++) {
      const q = questions[i];
      const uAns = userAnswers[i];
      let isCorrect = false;

      if (q.type === 'single') {
        isCorrect = (uAns === q.a);
      } else {
        if (uAns && Array.isArray(uAns)) {
          isCorrect = uAns.length === q.a.length && uAns.every(v => q.a.includes(v));
        }
      }

      if (isCorrect) score++;
      const fb = document.getElementById(`fb-${i}`);
      const item = document.getElementById(`q-box-${i}`);

      item.className = `question-item ${isCorrect ? 'correct' : 'incorrect'}`;
      fb.style.display = 'block';
      fb.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;

      const correctStr = q.type === 'single' ?
              q.opts[q.a] :
              q.a.map(aIdx => String.fromCharCode(65 + aIdx)).join(', ');

      fb.innerHTML = `
                <strong>${isCorrect ? '正确' : '错误'}</strong><br>
                正确答案：${correctStr}
            `;
    }
    alert(`本节校对完成！正确率：${score} / ${sec.end - sec.start}`);
  }

  function resetSection(sIdx) {
    const sec = sections[sIdx];
    for (let i = sec.start; i < sec.end; i++) {
      userAnswers[i] = null;
      const item = document.getElementById(`q-box-${i}`);
      item.className = 'question-item';
      item.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      item.querySelectorAll('input').forEach(input => input.checked = false);
      document.getElementById(`fb-${i}`).style.display = 'none';
    }
  }

  window.onload = init;
</script>

</body>
</html>
