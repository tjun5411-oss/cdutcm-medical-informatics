                "A. 不敢否定封建主义，在政治上企图依靠并无实权的皇帝",

                "D. 在策略上急于求成，变法措施过于激进，树敌过多",
                "E. 缺乏可靠的军事后盾，当顽固派反扑时毫无招架之力"
            ],
            answer: [0, 1, 2, 3, 4],
            knowledge: "戊戌变法失败的原因",
            explanation: "以上所有选项都是戊戌维新运动迅速失败的原因。"
        },

            options: [
                "A. 它是由新兴的民族资产阶级领导和发动的",

                "D. 它系统地介绍了西方资产阶级的社会政治学说和自然科学知识",
                "E. 它采取了和平请愿、上书言事等非暴力的斗争方式"
            ],

            explanation: "C选项错误，戊戌维新运动缺乏广泛而坚实的群众基础，主要局限于士大夫阶层。其他选项均正确。"

                "A. '剿发逆'（镇压太平天国），维护清王朝的封建统治",

    const itemsPerPage = 10;
    const totalSections = Math.ceil(questions.length / itemsPerPage);

    function init() {
        const wrapper = document.getElementById('sections-wrapper');
        wrapper.innerHTML = '';

        for (let s = 0; s < totalSections; s++) {
            const start = s * itemsPerPage;
            const end = Math.min(start + itemsPerPage, questions.length);
            const sectionContainer = document.createElement('div');
            sectionContainer.className = 'section-container';

            const title = document.createElement('h2');
            title.className = 'section-title';
            title.textContent = `第 ${s + 1} 组题目 (${start + 1}-${end})`;
            sectionContainer.appendChild(title);

            for (let i = start; i < end; i++) {
                sectionContainer.appendChild(createQuestionElement(questions[i], i));
            }

            const btnGroup = document.createElement('div');
            btnGroup.className = 'section-buttons';
            btnGroup.innerHTML = `
                <button class="section-btn reset-section-btn" onclick="resetGroup(${s}, ${start}, ${end})">重置本组</button>
                <button class="section-btn submit-section-btn" onclick="submitGroup(${s}, ${start}, ${end})">提交本组答案</button>
            `;
            sectionContainer.appendChild(btnGroup);
            wrapper.appendChild(sectionContainer);
        }
    }

    function createQuestionElement(q, index) {
        const div = document.createElement('div');
        div.className = 'question-item';
        div.id = `q-item-${index}`;
        const optionsHtml = q.options.map((opt, optIdx) => `
            <label class="option" id="label-${index}-${optIdx}">
                <input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q-${index}" value="${optIdx}">
                ${opt}
            </label>
        `).join('');
        div.innerHTML = `
            <div class="question-header">
                <div class="question-number">第${index + 1}题</div>
                <span class="question-type ${q.type === 'single' ? 'single-choice' : 'multiple-choice'}">${q.type === 'single' ? '单选题' : '多选题'}</span>
            </div>
            <div class="question-text">${q.text}</div>
            <div class="options-container">${optionsHtml}</div>
            <div class="feedback" id="feedback-${index}"></div>
        `;
        div.querySelectorAll('input').forEach(input => {
            input.onchange = function() {
                if(q.type === 'single') div.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                this.checked ? this.parentElement.classList.add('selected') : this.parentElement.classList.remove('selected');
            };
        });
        return div;
    }

    window.submitGroup = function(sIdx, start, end) {
        let correct = 0;
        for (let i = start; i < end; i++) {
            const q = questions[i];
            const feedback = document.getElementById(`feedback-${i}`);
            const item = document.getElementById(`q-item-${i}`);
            const selected = Array.from(document.getElementsByName(`q-${i}`)).filter(n => n.checked).map(n => parseInt(n.value));

            const isCorrect = q.type === 'single' ? (selected[0] === q.answer) : (JSON.stringify(selected.sort()) === JSON.stringify(q.answer.sort()));
            if(isCorrect) correct++;

            item.classList.remove('correct', 'incorrect');
            item.classList.add(isCorrect ? 'correct' : 'incorrect');
            feedback.style.display = 'block';
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            const ansTxt = Array.isArray(q.answer) ? q.answer.map(a => String.fromCharCode(65+a)).join(',') : String.fromCharCode(65+q.answer);
            feedback.innerHTML = `<div style="font-weight:600">${isCorrect ? '回答正确！' : '回答错误'}</div><div class="correct-answer-text">正确答案：${ansTxt}</div><div class="explanation"><strong>解析：</strong>${q.explanation}</div>`;
        }
        alert(`第 ${sIdx + 1} 组统计：\n总数：${end-start} 题\n正确：${correct} 题\n错误：${(end-start)-correct} 题`);
    };

    window.resetGroup = function(sIdx, start, end) {
        if(!confirm('确定重置本组吗？')) return;
        for (let i = start; i < end; i++) {
            const item = document.getElementById(`q-item-${i}`);
            item.classList.remove('correct', 'incorrect');
            document.getElementsByName(`q-${i}`).forEach(n => { n.checked = false; n.parentElement.classList.remove('selected'); });
            document.getElementById(`feedback-${i}`).style.display = 'none';
        }
    };

    document.addEventListener('DOMContentLoaded', init);
</script>
