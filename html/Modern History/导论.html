        {

            answer: [0, 1, 2, 3, 4],
            knowledge: "中国共产党成立的意义",
            explanation: "中国共产党的成立是开天辟地的大事变，具有以上所有重要意义，它使中国革命的面貌焕然一新。"

    // 应用状态
    const sections = [
        { start: 0, end: 10, containerId: "questions-section-1", name: "单项选择题 (1-10)" },
        { start: 10, end: 20, containerId: "questions-section-2", name: "单项选择题 (11-20)" },
        { start: 20, end: 25, containerId: "questions-section-3", name: "多项选择题 (21-25)" }
    ];

    let userAnswers = new Array(questions.length).fill(null);
    let questionStatus = new Array(questions.length).fill(null); // null=未答, true=正确, false=错误

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        renderAllQuestions();
    });

    // 渲染所有题目
    function renderAllQuestions() {
        sections.forEach((section, sectionIndex) => {
            const container = document.getElementById(section.containerId);
            if (!container) return;

            for (let i = section.start; i < section.end; i++) {
                const question = questions[i];
                const questionElement = createQuestionElement(question, i);
                container.appendChild(questionElement);
            }
        });
    }

    // 创建题目元素
    function createQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question-item';
        questionElement.dataset.index = index;

        // 根据答题状态设置样式
        if (questionStatus[index] === true) {
            questionElement.classList.add('correct');
        } else if (questionStatus[index] === false) {
            questionElement.classList.add('incorrect');
        }

        // 题目头部
        const questionHeader = document.createElement('div');
        questionHeader.className = 'question-header';

        const questionNumber = document.createElement('div');
        questionNumber.className = 'question-number';
        questionNumber.textContent = `第${index + 1}题`;

        const questionType = document.createElement('span');
        questionType.className = `question-type ${question.type === 'single' ? 'single-choice' : 'multiple-choice'}`;
        questionType.textContent = question.type === 'single' ? '单选题' : '多选题';

        questionHeader.appendChild(questionNumber);
        questionHeader.appendChild(questionType);

        // 题目内容
        const questionText = document.createElement('div');
        questionText.className = 'question-text';
        questionText.textContent = question.text;

        // 题目选项区域
        const questionContent = createChoiceContent(question, index);

        // 反馈区域
        const feedbackElement = document.createElement('div');
        feedbackElement.className = 'feedback';
        feedbackElement.id = `feedback-${index}`;

        // 组装题目元素
        questionElement.appendChild(questionHeader);
        questionElement.appendChild(questionText);
        questionElement.appendChild(questionContent);
        questionElement.appendChild(feedbackElement);

        return questionElement;
    }

    // 创建选择题内容（单选和多选）
    function createChoiceContent(question, index) {
        const container = document.createElement('div');
        container.className = 'options-container';

        question.options.forEach((option, optionIndex) => {
            const optionElement = document.createElement('div');
            optionElement.className = 'option';

            // 检查是否已选择该选项
            let isSelected = false;
            if (question.type === 'single') {
                isSelected = (userAnswers[index] === optionIndex);
            } else if (question.type === 'multiple') {
                isSelected = userAnswers[index] && userAnswers[index].includes(optionIndex);
            }

            if (isSelected) {
                optionElement.classList.add('selected');
            }

            // 如果已经提交过答案，显示正确答案和错误答案的样式
            if (questionStatus[index] !== null) {
                if (question.type === 'single') {
                    if (optionIndex === question.answer) {
                        optionElement.classList.add('correct-answer');
                    } else if (isSelected && optionIndex !== question.answer) {
                        optionElement.classList.add('incorrect-answer');
                    }
                } else if (question.type === 'multiple') {
                    if (question.answer.includes(optionIndex)) {
                        optionElement.classList.add('correct-answer');
                    } else if (isSelected && !question.answer.includes(optionIndex)) {
                        optionElement.classList.add('incorrect-answer');
                    }
                }
            }

            optionElement.dataset.optionIndex = optionIndex;
            optionElement.onclick = () => selectOption(index, optionIndex, question.type);

            const input = document.createElement('input');
            input.type = question.type === 'single' ? 'radio' : 'checkbox';
            input.name = `question-${index}`;
            input.id = `question-${index}-option-${optionIndex}`;
            input.checked = isSelected;

            const label = document.createElement('label');
            label.htmlFor = `question-${index}-option-${optionIndex}`;
            label.textContent = option;
            label.style.cursor = 'pointer';
            label.style.flex = '1';

            optionElement.appendChild(input);
            optionElement.appendChild(label);
            container.appendChild(optionElement);
        });

        return container;
    }

    // 选择选项
    function selectOption(questionIndex, optionIndex, questionType) {
        const question = questions[questionIndex];

        if (questionType === 'single') {
            // 单选题：直接选择
            userAnswers[questionIndex] = optionIndex;

            // 更新选项显示
            const questionElement = document.querySelector(`.question-item[data-index="${questionIndex}"]`);
            const options = questionElement.querySelectorAll('.option');

            options.forEach(option => {
                option.classList.remove('selected');
                const input = option.querySelector('input');
                if (input) input.checked = false;
            });

            // 设置选中的选项
            const selectedOption = questionElement.querySelector(`.option[data-option-index="${optionIndex}"]`);
            if (selectedOption) {
                selectedOption.classList.add('selected');
                const input = selectedOption.querySelector('input');
                if (input) input.checked = true;
            }
        } else if (questionType === 'multiple') {
            // 多选题：切换选择状态
            if (!userAnswers[questionIndex]) {
                userAnswers[questionIndex] = [];
            }

            const currentAnswers = userAnswers[questionIndex];
            const optionIndexInArray = currentAnswers.indexOf(optionIndex);

            if (optionIndexInArray === -1) {
                // 未选中，添加
                currentAnswers.push(optionIndex);
            } else {
                // 已选中，移除
                currentAnswers.splice(optionIndexInArray, 1);
            }

            // 更新选项显示
            const questionElement = document.querySelector(`.question-item[data-index="${questionIndex}"]`);
            const optionElement = questionElement.querySelector(`.option[data-option-index="${optionIndex}"]`);
            const input = optionElement.querySelector('input');

            if (currentAnswers.includes(optionIndex)) {
                optionElement.classList.add('selected');
                if (input) input.checked = true;
            } else {
                optionElement.classList.remove('selected');
                if (input) input.checked = false;
            }
        }

        // 更新答题状态显示
        const questionElement = document.querySelector(`.question-item[data-index="${questionIndex}"]`);
        if (questionElement) {
            questionElement.classList.remove('correct', 'incorrect');
        }
    }

    // 提交当前小节答案
    function submitSection(sectionIndex) {
        const section = sections[sectionIndex];
        let hasUnanswered = false;
        let unansweredIndices = [];

        // 检查本小节所有题目是否已答
        for (let i = section.start; i < section.end; i++) {
            const question = questions[i];
            let isAnswered = false;

            if (question.type === 'single') {
                isAnswered = userAnswers[i] !== null;
            } else if (question.type === 'multiple') {
                isAnswered = userAnswers[i] && userAnswers[i].length > 0;
            }

            if (!isAnswered) {
                hasUnanswered = true;
                unansweredIndices.push(i + 1);
            }
        }

        if (hasUnanswered) {
            alert(`本小节还有未完成的题目：第 ${unansweredIndices.join(', ')} 题，请先完成所有题目再提交！`);
            return;
        }

        // 提交本小节答案
        let sectionCorrectCount = 0;

        for (let i = section.start; i < section.end; i++) {
            const question = questions[i];
            let isCorrect = false;

            if (question.type === 'single') {
                isCorrect = (userAnswers[i] === question.answer);
            } else if (question.type === 'multiple') {
                // 检查多选题答案：必须完全匹配
                const userAnswer = userAnswers[i] ? [...userAnswers[i]].sort() : [];
                const correctAnswer = [...question.answer].sort();
                isCorrect = JSON.stringify(userAnswer) === JSON.stringify(correctAnswer);
            }

            // 更新答题状态
            questionStatus[i] = isCorrect;

            if (isCorrect) {
                sectionCorrectCount++;
            }

            // 显示反馈
            showFeedback(i, isCorrect, question);

            // 更新题目样式
            const questionElement = document.querySelector(`.question-item[data-index="${i}"]`);
            if (questionElement) {
                questionElement.classList.add(isCorrect ? 'correct' : 'incorrect');
            }
        }

        // 显示本小节答题结果
        const sectionQuestionCount = section.end - section.start;
        alert(`本小节答题完成！\n正确: ${sectionCorrectCount}题\n错误: ${sectionQuestionCount - sectionCorrectCount}题`);
    }

    // 显示反馈
    function showFeedback(questionIndex, isCorrect, question) {
        const feedbackElement = document.getElementById(`feedback-${questionIndex}`);
        if (!feedbackElement) return;

        feedbackElement.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
        feedbackElement.style.display = 'block';

        let feedbackHTML = '';
        if (isCorrect) {
            feedbackHTML = '<div class="feedback-title">回答正确！</div><div>恭喜你，答案正确。</div>';
        } else {
            feedbackHTML = '<div class="feedback-title">回答错误！</div><div>你的答案不正确。</div>';

            // 显示正确答案
            let correctAnswerText = '';
            if (question.type === 'single') {
                correctAnswerText = question.options[question.answer];
            } else if (question.type === 'multiple') {
                const correctOptions = question.answer.map(idx => question.options[idx]);
                correctAnswerText = correctOptions.join('<br>');
            }

            feedbackHTML += `<div class="correct-answer">正确答案：<br>${correctAnswerText}</div>`;
        }

        // 添加解析
        if (question.explanation) {
            feedbackHTML += `<div class="explanation">解析：${question.explanation}</div>`;
        }

        feedbackElement.innerHTML = feedbackHTML;
    }

    // 重置当前小节
    function resetSection(sectionIndex) {
        if (confirm(`确定要重置第${sectionIndex + 1}小节的答题内容吗？本小节的答题进度将被清除。`)) {
            const section = sections[sectionIndex];

            for (let i = section.start; i < section.end; i++) {
                // 重置本小节的答题数据
                userAnswers[i] = null;
                questionStatus[i] = null;

                // 重置选项显示
                const questionElement = document.querySelector(`.question-item[data-index="${i}"]`);
                if (questionElement) {
                    questionElement.classList.remove('correct', 'incorrect');

                    const options = questionElement.querySelectorAll('.option');
                    options.forEach(option => {
                        option.classList.remove('selected', 'correct-answer', 'incorrect-answer');
                        const input = option.querySelector('input');
                        if (input) input.checked = false;
                    });
                }

                // 重置反馈显示
                const feedbackElement = document.getElementById(`feedback-${i}`);
                if (feedbackElement) {
                    feedbackElement.style.display = 'none';
                }
            }

            alert(`第${sectionIndex + 1}小节已重置！`);
        }
    }

    // 跳转到下一章
    function goToNextChapter() {
        // 检查是否所有小节都已提交
        let allSectionsSubmitted = true;
        let unsubmittedSections = [];

        for (let s = 0; s < sections.length; s++) {
            const section = sections[s];
            let sectionSubmitted = true;

            for (let i = section.start; i < section.end; i++) {
                if (questionStatus[i] === null) {
                    sectionSubmitted = false;
                    break;
                }
            }

            if (!sectionSubmitted) {
                allSectionsSubmitted = false;
                unsubmittedSections.push(s + 1);
            }
        }

        if (!allSectionsSubmitted) {
            alert(`还有未提交的小节：第 ${unsubmittedSections.join(', ')} 小节，请先完成所有题目再进入下一章！`);
            return;
        }

        // 跳转到下一章
        window.location.href = '第一章.html';
    }
