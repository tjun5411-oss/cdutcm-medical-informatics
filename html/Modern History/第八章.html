        { q: "6. 对个体农业进行社会主义改造的成功经验包括", a: [0, 1, 2, 4], type: "multiple", opts: ["A. 趁热打铁引导合作", "B. 逐步过渡形式", "C. 稳步前进方针", "D. 阶级路线", "E. 自愿互利典型示范"] },
        { q: "7. 能够对民族资本主义经济实行和平赎买是由于", a: [0, 1, 2, 3, 4], type: "multiple", opts: ["A. 两面性", "B. 强大政权", "C. 国家机器", "D. 掌握命脉", "E. 割断联系"] },
        { q: "8. 社会主义改造过程中出现的偏差和遗留问题包括", a: [0, 1, 2, 3], type: "multiple", opts: ["A. 所有制结构单一", "B. 计划体制扩大", "C. 排斥市场", "D. 四过（急、快、粗、单）", "E. 阶级斗争动力"] },
        { q: "9. 高级社与初级社相比，“完全社会主义性质”体现在", a: [1, 3], type: "multiple", opts: ["A. 个人所有", "B. 集体所有", "C. 统一经营", "D. 按劳分配", "E. 自留地"] },
        { q: "10. “三大改造”胜利完成的深远历史意义在于", a: [0, 1, 2, 3], type: "multiple", opts: ["A. 制度初步确立", "B. 深刻变革", "C. 奠定政治制度基础", "D. 赎买范例", "E. 照搬苏联模式"] },
        { q: "12. “和平赎买”政策的复杂性体现在", a: [0, 1, 2, 4], type: "multiple", opts: ["A. 伴随斗争", "B. 非等价交换", "C. 包含思想改造", "D. 排除强制手段", "E. 形式随深入而演变"] },
        { q: "13. 三大改造完成标志社会主义制度确立，具体涵义包括", a: [0, 1, 2, 3], type: "multiple", opts: ["A. 公有制主体", "B. 按劳分配建立", "C. 计划配置资源", "D. 阶级结构变化", "E. 法律确认地位"] },
        { q: "14. “四过”问题的成因分析合理的包括", a: [0, 1, 2, 3, 4], type: "multiple", opts: ["A. 缺乏充分认识", "B. 赶超驱动", "C. 群众运动习惯", "D. 苏联模式局限", "E. 低估复杂性"] },
        { q: "16. 中共八大在探索道路方面的重要成果有", a: [0, 1, 2, 3], type: "multiple", opts: ["A. 分析主要矛盾", "B. 建设方针", "C. 民主法制", "D. 民主集中制", "E. 双百方针（此为毛提出，八大确认，选ABCD较稳）"] },
        { q: "17. 《关于正确处理人民内部矛盾的问题》基本观点包括", a: [0, 1, 2, 3, 4], type: "multiple", opts: ["A. 社会充满矛盾", "B. 基本矛盾论述", "C. 两类矛盾划分", "&nbsp;D. 性质区分", "E. 政治生活主题"] },
        { q: "18. 1957年整风逆转并扩大化的原因包括", a: [0, 1, 2, 3, 4], type: "multiple", opts: ["A. 右派进攻事实", "B. 严重估计形势", "C. 习惯运动方法", "D. 群众不满", "E. 缺乏法制甄别"] },
        { q: "19. 1956-1957年经济管理体制方面富有创见的思想包括", a: [0, 1, 2, 4], type: "multiple", opts: ["A. 三个主体三个补充", "B. 中央地方积极性", "C. 私营补充", "D. 知识分子论述", "E. 农业生产责任制构想"] },
        { q: "20. 探索成果未能坚持的深层原因在于", a: [0, 1, 2, 3, 4], type: "multiple", opts: ["A. 认识不深刻", "B. 左倾偏差", "C. 革命思维惯性", "D. 国际影响", "E. 缺乏保障"] }
    ];

    const sections = [
        { title: "单选 2-25：巩固政权与三大改造启动", start: 0, end: 20 },
        { title: "单选 26-55：改造深化与初步探索", start: 20, end: 47 },
        { title: "多项选择题：历史意义与经验总结", start: 47, end: 65 }
    ];

    let userAnswers = new Array(questions.length).fill(null);

    function init() {
        const container = document.getElementById('quiz-app');
        sections.forEach((sec, sIdx) => {
            const secDiv = document.createElement('div');
            secDiv.className = 'section-container';
            secDiv.innerHTML = `<h2 class="section-title"><i class="fas fa-hammer"></i> ${sec.title}</h2><div id="sec-${sIdx}"></div>`;

            const btnDiv = document.createElement('div');
            btnDiv.className = 'btn-group';
            btnDiv.innerHTML = `
                <button class="btn btn-reset" onclick="resetSection(${sIdx})">重置本节</button>
                <button class="btn btn-submit" onclick="submitSection(${sIdx})">校对本节</button>
            `;
            secDiv.appendChild(btnDiv);
            container.appendChild(secDiv);

            const qBox = secDiv.querySelector(`#sec-${sIdx}`);
            for (let i = sec.start; i < sec.end; i++) {
                if(questions[i]) qBox.appendChild(createQ(i));
            }
        });
    }

    function createQ(idx) {
        const q = questions[idx];
        const div = document.createElement('div');
        div.className = 'question-item';
        div.id = `q-box-${idx}`;

        div.innerHTML = `
            <div class="question-header">
                <span class="question-number">第 ${q.q.split('.')[0]} 题</span>
                <span class="question-type ${q.type}-choice">${q.type === 'single' ? '单选' : '多选'}</span>
            </div>
            <div class="question-text">${q.q.includes('.') ? q.q.split('.')[1] : q.q}</div>
            <div class="options-container">
                ${q.opts.map((o, oi) => `
                    <div class="option" onclick="handleSel(${idx}, ${oi})">
                        <input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q${idx}" id="q${idx}o${oi}">
                        <label>${o}</label>
                    </div>
                `).join('')}
            </div>
            <div class="feedback" id="fb-${idx}"></div>
        `;
        return div;
    }

    function handleSel(qi, oi) {
        const q = questions[qi];
        const container = document.getElementById(`q-box-${qi}`);
        const inputs = container.querySelectorAll('input');
        const opts = container.querySelectorAll('.option');

        if (q.type === 'single') {
            userAnswers[qi] = oi;
            opts.forEach(o => o.classList.remove('selected'));
            opts[oi].classList.add('selected');
            inputs[oi].checked = true;
        } else {
            if (!userAnswers[qi]) userAnswers[qi] = [];
            const pos = userAnswers[qi].indexOf(oi);
            if (pos > -1) {
                userAnswers[qi].splice(pos, 1);
                opts[oi].classList.remove('selected');
                inputs[oi].checked = false;
            } else {
                userAnswers[qi].push(oi);
                opts[oi].classList.add('selected');
                inputs[oi].checked = true;
            }
        }
    }

    function submitSection(sIdx) {
        const sec = sections[sIdx];
        let score = 0;
        let total = 0;
        for (let i = sec.start; i < sec.end; i++) {
            if(!questions[i]) continue;
            total++;
            const q = questions[i];
            const uAns = userAnswers[i];
            let isCorrect = false;

            if (q.type === 'single') {
                isCorrect = (uAns === q.a);
            } else {
                if (uAns && Array.isArray(uAns)) {
                    isCorrect = uAns.length === q.a.length && uAns.every(v => q.a.includes(v));
                }
            }

            if (isCorrect) score++;
            const fb = document.getElementById(`fb-${i}`);
            const item = document.getElementById(`q-box-${i}`);

            item.className = `question-item ${isCorrect ? 'correct' : 'incorrect'}`;
            fb.style.display = 'block';
            fb.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;

            const correctStr = q.type === 'single' ?
                q.opts[q.a] :
                q.a.map(aIdx => String.fromCharCode(65 + aIdx)).join(', ');

            fb.innerHTML = `<strong>${isCorrect ? '正确' : '错误'}</strong> | 正确答案：${correctStr}`;
        }
        alert(`校对完成！得分：${score}/${total}`);
    }

    function resetSection(sIdx) {
        const sec = sections[sIdx];
        for (let i = sec.start; i < sec.end; i++) {
            if(!questions[i]) continue;
            userAnswers[i] = null;
            const item = document.getElementById(`q-box-${i}`);
            item.className = 'question-item';
            item.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            item.querySelectorAll('input').forEach(input => input.checked = false);
            document.getElementById(`fb-${i}`).style.display = 'none';
        }
    }

    window.onload = init;
</script>

</body>
</html>
