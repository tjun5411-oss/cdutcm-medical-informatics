    const itemsPerPage = 10;
    const sections = [];
    const userAnswers = new Array(questions.length).fill(null);
    const questionStatus = new Array(questions.length).fill(null);

    function init() {
        const container = document.getElementById('quiz-container');
        for (let i = 0; i < questions.length; i += itemsPerPage) {
            sections.push({ start: i, end: Math.min(i + itemsPerPage, questions.length) });
        }

        sections.forEach((sec, sIdx) => {
            const secDiv = document.createElement('div');
            secDiv.className = 'section-container';
            secDiv.innerHTML = `<h2 class="section-title">第 ${sIdx + 1} 小节 (${sec.start + 1}-${sec.end}题)</h2>`;

            for (let i = sec.start; i < sec.end; i++) {
                secDiv.appendChild(createQuestionHTML(i));
            }

            const footer = document.createElement('div');
            footer.className = 'section-footer';
            footer.innerHTML = `
                <button class="section-btn reset-btn" onclick="resetSection(${sIdx})">重置本节</button>
                <button class="section-btn submit-btn" onclick="submitSection(${sIdx})">提交本节答案</button>
            `;
            secDiv.appendChild(footer);
            container.appendChild(secDiv);
        });
    }

    function createQuestionHTML(i) {
        const q = questions[i];
        const div = document.createElement('div');
        div.className = 'question-item';
        div.setAttribute('data-index', i);

        let optionsHTML = q.options.map((opt, oIdx) => `
            <div class="option" onclick="handleSelect(${i}, ${oIdx})">
                <input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q${i}" id="q${i}_${oIdx}">
                <label>${opt}</label>
            </div>
        `).join('');

        div.innerHTML = `
            <div class="question-header">
                <span class="question-number">第 ${i + 1} 题</span>
                <span class="question-type ${q.type === 'single' ? 'single-choice' : 'multiple-choice'}">
                    ${q.type === 'single' ? '单选题' : '多选题'}
                </span>
            </div>
            <p class="question-text">${q.text}</p>
            <div class="options-container">${optionsHTML}</div>
            <div class="feedback" id="feedback-${i}"></div>
        `;
        return div;
    }

    window.handleSelect = function(qIdx, oIdx) {
        if (questionStatus[qIdx] !== null) return;
        const q = questions[qIdx];
        const container = document.querySelector(`.question-item[data-index="${qIdx}"]`);
        const inputs = container.querySelectorAll('input');

        if (q.type === 'single') {
            userAnswers[qIdx] = oIdx;
            container.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            container.querySelectorAll('.option')[oIdx].classList.add('selected');
            inputs[oIdx].checked = true;
        } else {
            if (!userAnswers[qIdx]) userAnswers[qIdx] = [];
            const idx = userAnswers[qIdx].indexOf(oIdx);
            if (idx > -1) {
                userAnswers[qIdx].splice(idx, 1);
                container.querySelectorAll('.option')[oIdx].classList.remove('selected');
                inputs[oIdx].checked = false;
            } else {
                userAnswers[qIdx].push(oIdx);
                container.querySelectorAll('.option')[oIdx].classList.add('selected');
                inputs[oIdx].checked = true;
            }
        }
    };

    window.submitSection = function(sIdx) {
        const sec = sections[sIdx];
        let correctCount = 0;
        let totalCount = sec.end - sec.start;

        for (let i = sec.start; i < sec.end; i++) {
            const q = questions[i];
            const uAns = userAnswers[i];

            if (uAns === null || (Array.isArray(uAns) && uAns.length === 0)) {
                alert(`第 ${i + 1} 题尚未完成，请先答题！`);
                return;
            }

            let isCorrect = false;
            if (q.type === 'single') {
                isCorrect = uAns === q.answer;
            } else {
                isCorrect = JSON.stringify(uAns.sort()) === JSON.stringify(q.answer.sort());
            }

            if (isCorrect) correctCount++;
            questionStatus[i] = isCorrect;
            showFeedback(i, isCorrect, q);
        }

        const wrongCount = totalCount - correctCount;
        alert(`第 ${sIdx + 1} 小节提交成功！\n\n统计结果：\n✅ 正确：${correctCount} 道\n❌ 错误：${wrongCount} 道\n💯 正确率：${((correctCount/totalCount)*100).toFixed(2)}%`);
    };

    function showFeedback(i, isCorrect, q) {
        const fb = document.getElementById(`feedback-${i}`);
        const item = document.querySelector(`.question-item[data-index="${i}"]`);
        item.classList.add(isCorrect ? 'correct' : 'incorrect');
        fb.style.display = 'block';
        fb.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;

        let correctText = q.type === 'single' ? q.options[q.answer] : q.answer.map(idx => q.options[idx]).join(', ');
        fb.innerHTML = `
            <div class="feedback-title">${isCorrect ? '✅ 回答正确' : '❌ 回答错误'}</div>
            <div class="correct-answer">正确答案：${correctText}</div>
            <div class="explanation">解析：${q.explanation}</div>
        `;
    }

    window.resetSection = function(sIdx) {
        if (!confirm("确定重置本节吗？所有答案和反馈将被清空。")) return;
        const sec = sections[sIdx];
        for (let i = sec.start; i < sec.end; i++) {
            // 1. 重置逻辑数据
            userAnswers[i] = null;
            questionStatus[i] = null;

            // 2. 重置界面样式
            const item = document.querySelector(`.question-item[data-index="${i}"]`);
            item.classList.remove('correct', 'incorrect');
            item.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));

            // 3. 必须重置真实的 input 状态，否则下次点击可能无效
            item.querySelectorAll('input').forEach(input => input.checked = false);

            // 4. 隐藏反馈
            const fb = document.getElementById(`feedback-${i}`);
            fb.style.display = 'none';
        }
        alert(`第 ${sIdx + 1} 小节数据已重置！`);
    };

    window.goToNextChapter = function() {
        window.location.href = '第四章.html';
    };

    document.addEventListener('DOMContentLoaded', init);
</script>
