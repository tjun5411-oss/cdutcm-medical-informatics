<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>医学数据分析与挖掘 - 第四章</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
body{background:#f0f5fb;color:#333;line-height:1.6;padding:20px}
.container{max-width:1400px;margin:0 auto}
header{text-align:center;padding:20px;background:linear-gradient(135deg,#4A90D9 0%,#5BA0E9 100%);color:white;border-radius:12px;box-shadow:0 6px 15px rgba(74,144,217,0.2);margin-bottom:25px}
h1{font-size:2.2rem;margin-bottom:10px;letter-spacing:1px}
.subtitle{font-size:1.1rem;opacity:0.9}
.section-container{background:white;border-radius:12px;padding:30px;box-shadow:0 5px 15px rgba(0,0,0,0.08);margin-bottom:30px}
.section-title{font-size:1.5rem;margin-bottom:25px;color:#2C6FBB;padding-bottom:15px;border-bottom:2px solid #e0eaf5}
.question-item{border:1px solid #e0eaf5;border-radius:10px;padding:20px;margin-bottom:20px;transition:all 0.3s}
.question-item.correct{border-color:#4CAF50;background:#f9fff9}
.question-item.incorrect{border-color:#f44336;background:#fff9f9}
.question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.question-number{font-size:1.2rem;font-weight:600;color:#2C6FBB}
.question-type{display:inline-block;padding:4px 12px;border-radius:15px;font-size:0.85rem;font-weight:600}
.single-choice{background:#e6f2ff;color:#0066cc}
.multiple-choice{background:#f0e6ff;color:#6600cc}
.true-false{background:#e6ffe6;color:#2e7d32}
.question-text{font-size:1.1rem;margin-bottom:20px;line-height:1.6}
.options-container{margin:15px 0}
.option{margin-bottom:10px;padding:12px 15px;border:1px solid #dce8f5;border-radius:6px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center}
.option:hover{border-color:#a3c9f0;background:#f0f6fc}
.option.selected{border-color:#4A90D9;background:#e6f0fb}
.option.correct-answer{border-color:#4CAF50;background:#e6ffe6}
.option.incorrect-answer{border-color:#f44336;background:#ffe6e6}
.option input{margin-right:10px;cursor:pointer}
.option label{cursor:pointer;flex:1}
.feedback{padding:15px;border-radius:6px;margin-top:15px;font-size:0.95rem;display:none}
.feedback.correct{background:#e6ffe6;border-left:4px solid #4CAF50}
.feedback.incorrect{background:#ffe6e6;border-left:4px solid #f44336}
.feedback-title{font-weight:600;margin-bottom:8px}
.correct-answer{margin-top:10px;padding:8px;background:white;border-radius:4px;border:1px dashed #ccc;font-weight:600}
.explanation{margin-top:15px;padding:12px;background:#f9f9f9;border-radius:6px;border-left:3px solid #4A90D9;font-size:0.95rem;line-height:1.5}
.section-buttons{display:flex;gap:15px;margin-top:30px}
.section-btn{padding:12px 25px;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s}
.reset-btn{background:#7fb3e0;color:white}
.reset-btn:hover{background:#5a9fd4}
.submit-btn{background:#4A90D9;color:white}
.submit-btn:hover{background:#2C6FBB}
.nav{display:flex;justify-content:space-between;margin-top:30px}
.nav-btn{padding:12px 30px;border:none;border-radius:6px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:10px}
.prev-btn{background:#999;color:white}
.prev-btn:hover{background:#777}
.prev-btn:disabled{background:#ccc;cursor:not-allowed}
.next-btn{background:#4A90D9;color:white}
.next-btn:hover{background:#2C6FBB}
.next-btn:disabled{background:#ccc;cursor:not-allowed}
.footer{text-align:center;padding:20px;color:#999;font-size:0.9rem;margin-top:40px;border-top:1px solid #e0eaf5}
@media(max-width:768px){.section-buttons,.nav{flex-direction:column}.nav-btn{width:100%;justify-content:center}h1{font-size:1.6rem}}
</style></head><body><div class="container">
<header><h1>第四章 关联规则挖掘</h1><p class="subtitle">共20题 | 单选题8题 | 多选题2题 | 判断题10题 | 每题附带解析</p></header>
<div class="section-container"><h2 class="section-title">第一部分：单项选择题（1-8）</h2><div class="questions-container" id="s0"></div><div class="section-buttons"><button class="section-btn reset-btn" onclick="reset(0)">重置本小节</button><button class="section-btn submit-btn" onclick="sub(0)">提交本小节答案</button></div></div><div class="section-container"><h2 class="section-title">第二部分：多项选择题（9-10）</h2><div class="questions-container" id="s1"></div><div class="section-buttons"><button class="section-btn reset-btn" onclick="reset(1)">重置本小节</button><button class="section-btn submit-btn" onclick="sub(1)">提交本小节答案</button></div></div><div class="section-container"><h2 class="section-title">第三部分：判断题（11-20）</h2><div class="questions-container" id="s2"></div><div class="section-buttons"><button class="section-btn reset-btn" onclick="reset(2)">重置本小节</button><button class="section-btn submit-btn" onclick="sub(2)">提交本小节答案</button></div></div>
<div class="nav"><button class="nav-btn prev-btn" onclick="gt('第三章')"><i class="fas fa-arrow-left"></i> 上一章</button><button class="nav-btn next-btn" onclick="gt('第五章')">下一章 <i class="fas fa-arrow-right"></i></button></div>
<div class="footer"><p>医学数据分析与挖掘 - 第四章 | 基于学堂在线课程</p><p style="font-size:0.8rem;margin-top:5px">共20题 | 每题附带解析</p></div></div>
<script>
var q=[{"type": "single", "text": "某超市研究销售纪录数据后发现，买啤酒的人很大概率也会购买尿布，这属于数据挖掘的哪类问题？", "options": ["A. 关联规则发现", "B. 聚类", "C. 分类", "D. 自然语言处理"], "answer": 0, "explanation": "啤酒与尿布是经典的关联规则发现案例。"}, {"type": "single", "text": "设X={1,2,3}是频繁项集，则可由X产生（ ）个关联规则。", "options": ["A. 4", "B. 5", "C. 6", "D. 7"], "answer": 2, "explanation": "3项集可产生2^3-2=6个关联规则。"}, {"type": "single", "text": "考虑频繁3-项集集合，采用合并策略得到4-项集不包含", "options": ["A. {1,2,3,4}", "B. {1,2,3,5}", "C. {1,2,4,5}", "D. {1,3,4,5}"], "answer": 2, "explanation": "{1,2,4,5}不能由给定3-项集合并得到。"}, {"type": "single", "text": "在图集合中发现一组公共子结构，这样的任务称为", "options": ["A. 频繁子集挖掘", "B. 频繁子图挖掘", "C. 频繁数据项挖掘", "D. 频繁模式挖掘"], "answer": 1, "explanation": "图中发现公共子结构的任务称为频繁子图挖掘。"}, {"type": "single", "text": "下面购物篮能够提取的3-项集的最大数量是", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": 2, "explanation": "最多可提取3个3-项集。"}, {"type": "single", "text": "可用作数据挖掘分析中的关联规则算法有", "options": ["A. 决策树、对数回归、关联模式", "B. K均值法、SOM神经网络", "C. Apriori算法、FP-Tree算法", "D. RBF神经网络、K均值法、决策树"], "answer": 2, "explanation": "Apriori和FP-Tree是最经典的关联规则算法。"}, {"type": "single", "text": "关联规则的评价指标是", "options": ["A. 均方误差、均方根误差", "B. Kappa统计、显著性检验", "C. 支持度、置信度", "D. 平均绝对误差、相对误差"], "answer": 2, "explanation": "关联规则的评价指标是支持度和置信度。"}, {"type": "single", "text": "分析顾客就医行为，以便有针对性地向其推荐感兴趣的就医服务，属于（ ）问题。", "options": ["A. 关联分析", "B. 分类", "C. 聚类分析", "D. 时序预测"], "answer": 0, "explanation": "根据就医行为推荐服务属于关联分析。"}, {"type": "multiple", "text": "利用Apriori算法，在购物篮中产生支持度不小于3的候选3-项集，在候选2-项集中需要剪枝的是", "options": ["A. {啤酒,尿布}", "B. {面包,黄油}", "C. {面包,尿布}", "D. {牛奶,可乐}", "E. {面包,牛奶}"], "answer": [1, 3], "explanation": "{面包,黄油}和{牛奶,可乐}不是频繁的，需要剪枝。"}, {"type": "multiple", "text": "Apriori算法的计算复杂度受（ ）影响。", "options": ["A. 支持度阈值", "B. 项数", "C. 事务数", "D. 事务平均宽度", "E. 极差"], "answer": [0, 1, 2, 3], "explanation": "Apriori复杂度受支持度阈值、项数、事务数和事务平均宽度影响。"}, {"type": "true-false", "text": "比率标度属性能提供关于顺序、差异以及比率关系的信息，关键之处在于真正零值能被定义。", "options": ["正确", "错误"], "answer": 0, "explanation": "正确。"}, {"type": "true-false", "text": "当资料分布末端无确切数据时不能计算算术平均值。", "options": ["正确", "错误"], "answer": 0, "explanation": "正确。"}, {"type": "true-false", "text": "在图集合中发现一组公共子结构，这样的任务称为频繁子图挖掘。", "options": ["正确", "错误"], "answer": 0, "explanation": "正确。"}, {"type": "true-false", "text": "决策树方法通常用于关联规则挖掘。", "options": ["正确", "错误"], "answer": 1, "explanation": "错误，决策树主要用于分类和回归。"}, {"type": "true-false", "text": "Apriori算法是一种典型的关联规则挖掘算法。", "options": ["正确", "错误"], "answer": 0, "explanation": "正确。"}, {"type": "true-false", "text": "关联规则挖掘过程是发现满足最小支持度的所有项集代表的规则。", "options": ["正确", "错误"], "answer": 1, "explanation": "错误，还需满足最小置信度。"}, {"type": "true-false", "text": "可信度是对关联规则的准确度的衡量。", "options": ["正确", "错误"], "answer": 1, "explanation": "错误，置信度衡量关联规则的准确度。"}, {"type": "true-false", "text": "利用先验原理可以帮助减少频繁项集产生时需要探查的候选项目个数。", "options": ["正确", "错误"], "answer": 0, "explanation": "正确。"}, {"type": "true-false", "text": "先验原理可以表述为：如果一个项集是频繁的，则包含它的所有项集也是频繁的。", "options": ["正确", "错误"], "answer": 1, "explanation": "错误，先验原理是：频繁项集的所有子集也是频繁的。"}, {"type": "true-false", "text": "回归分析通常用于挖掘关联规则。", "options": ["正确", "错误"], "answer": 1, "explanation": "错误，回归分析用于预测数值型结果。"}];
var s=[{"name": "第一部分：单项选择题（1-8）", "start": 0, "end": 8, "containerId": "s0"}, {"name": "第二部分：多项选择题（9-10）", "start": 8, "end": 10, "containerId": "s1"}, {"name": "第三部分：判断题（11-20）", "start": 10, "end": 20, "containerId": "s2"}];
var u=new Array(q.length).fill(null),qs=new Array(q.length).fill(null);
window.onload=function(){s.forEach(function(si,i){var c=document.getElementById(si.containerId);if(!c)return;for(var j=si.start;j<si.end;j++)c.appendChild(mkQ(q[j],j))})};
function mkQ(qi,idx){var e=document.createElement('div');e.className='question-item';e.dataset.idx=idx;
if(qs[idx]===true)e.classList.add('correct');else if(qs[idx]===false)e.classList.add('incorrect');
var h=document.createElement('div');h.className='question-header';
var n=document.createElement('div');n.className='question-number';n.textContent='第'+(idx+1)+'题';
var t=document.createElement('span');var tm={'single':'single-choice','multiple':'multiple-choice','true-false':'true-false'};
var lm={'single':'单选','multiple':'多选','true-false':'判断'};
t.className='question-type '+tm[qi.type];t.textContent=lm[qi.type];
h.appendChild(n);h.appendChild(t);
var tx=document.createElement('div');tx.className='question-text';tx.textContent=qi.text;
var oc=mkOpts(qi,idx);var fb=document.createElement('div');fb.className='feedback';fb.id='f'+idx;
e.appendChild(h);e.appendChild(tx);e.appendChild(oc);e.appendChild(fb);return e;}
function mkOpts(qi,idx){var c=document.createElement('div');c.className='options-container';
qi.options.forEach(function(o,oi){var oe=document.createElement('div');oe.className='option';
var st=(qi.type==='single'||qi.type==='true-false');
var sel=st?(u[idx]===oi):(u[idx]&&u[idx].includes(oi));
if(sel)oe.classList.add('selected');
if(qs[idx]!==null){if(st){if(oi===qi.answer)oe.classList.add('correct-answer');else if(sel)oe.classList.add('incorrect-answer');}
else{if(qi.answer.includes(oi))oe.classList.add('correct-answer');else if(sel&&!qi.answer.includes(oi))oe.classList.add('incorrect-answer');}}
oe.dataset.oi=oi;oe.onclick=function(){selOpt(idx,oi,qi.type)};
var inp=document.createElement('input');inp.type=(qi.type==='multiple')?'checkbox':'radio';
inp.name='q'+idx;inp.id='q'+idx+'o'+oi;inp.checked=sel;
var lb=document.createElement('label');lb.htmlFor='q'+idx+'o'+oi;lb.textContent=o;lb.style.cssText='cursor:pointer;flex:1';
oe.appendChild(inp);oe.appendChild(lb);c.appendChild(oe)});return c}
function selOpt(idx,oi,qt){var st=(qt==='single'||qt==='true-false');
if(st){u[idx]=oi;var e=document.querySelector('[data-idx="'+idx+'"]');
e.querySelectorAll('.option').forEach(function(o){o.classList.remove('selected');var i=o.querySelector('input');if(i)i.checked=false});
var se=e.querySelector('[data-oi="'+oi+'"]');if(se){se.classList.add('selected');var i=se.querySelector('input');if(i)i.checked=true}}
else{if(!u[idx])u[idx]=[];var a=u[idx],p=a.indexOf(oi);if(p===-1)a.push(oi);else a.splice(p,1);
var e=document.querySelector('[data-idx="'+idx+'"]');
var oe=e.querySelector('[data-oi="'+oi+'"]');var i=oe.querySelector('input');
if(a.includes(oi)){oe.classList.add('selected');if(i)i.checked=true}else{oe.classList.remove('selected');if(i)i.checked=false}}
var e2=document.querySelector('[data-idx="'+idx+'"]');if(e2)e2.classList.remove('correct','incorrect')}
function sub(si){var sec=s[si];var hu=false,ui=[];
for(var i=sec.start;i<sec.end;i++){var qi=q[i];var ans=(qi.type==='single'||qi.type==='true-false')?(u[i]!==null):(u[i]&&u[i].length>0);if(!ans){hu=true;ui.push(i+1)}}
if(hu){alert('未完成：第'+ui.join(',')+'题');return}var cc=0;
for(var i=sec.start;i<sec.end;i++){var qi=q[i],ic=false;
if(qi.type==='single'||qi.type==='true-false')ic=(u[i]===qi.answer);
else{var ua=u[i]?u[i].slice().sort():[],ca=qi.answer.slice().sort();ic=JSON.stringify(ua)===JSON.stringify(ca)}
qs[i]=ic;if(ic)cc++;sf(i,ic,qi);
var e=document.querySelector('[data-idx="'+i+'"]');if(e)e.classList.add(ic?'correct':'incorrect')}
alert('正确:'+cc+'\n错误:'+(sec.end-sec.start-cc))}
function sf(idx,ic,qi){var fe=document.getElementById('f'+idx);if(!fe)return;
fe.className='feedback '+(ic?'correct':'incorrect');fe.style.display='block';
var h=ic?'<div class="feedback-title">正确！</div>':'<div class="feedback-title">错误！</div>';
if(!ic){var cat='';if(qi.type==='single'||qi.type==='true-false')cat=qi.options[qi.answer];
else cat=qi.answer.map(function(i){return qi.options[i]}).join('<br>');
h+='<div class="correct-answer">正确答案：<br>'+cat+'</div>'}
if(qi.explanation)h+='<div class="explanation">解析：'+qi.explanation+'</div>';fe.innerHTML=h}
function reset(si){if(!confirm('确定重置？'))return;var sec=s[si];
for(var i=sec.start;i<sec.end;i++){u[i]=null;qs[i]=null;
var e=document.querySelector('[data-idx="'+i+'"]');
if(e){e.classList.remove('correct','incorrect');e.querySelectorAll('.option').forEach(function(o){o.classList.remove('selected','correct-answer','incorrect-answer');var i2=o.querySelector('input');if(i2)i2.checked=false})}
var fe=document.getElementById('f'+i);if(fe)fe.style.display='none'}alert('已重置')}
function gt(ch){for(var s2=0;s2<s.length;s2++){var sec=s[s2];for(var i=sec.start;i<sec.end;i++){if(qs[i]===null){alert('请先完成所有题目');return}}}
window.location.href=ch+'.html'}
</script></body></html>
