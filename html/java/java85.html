    <style>
        :root {
            --primary-color: #2c3e50;

            --error-color: #e74c3c;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
        }

        /* Navigation */
        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(245, 246, 250, 0.95);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .page-btn {
            background: var(--card-bg);
            border: 1px solid #ddd;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .page-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .page-btn:hover:not(.active) {
            background-color: #e9ecef;
        }

        /* Question Cards */
        .question-card {
            background: var(--card-bg);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid transparent;
        }

        .question-card.correct { border-left-color: var(--success-color); }
        .question-card.wrong { border-left-color: var(--error-color);
            animation: shake 0.4s ease-in-out; /* 当标记为错误时晃动一下 */ }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }



        .q-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .code-block {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 15px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            margin: 10px 0;
            white-space: pre;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background-color: #f8f9fa;
        }

        .option-item input {
            margin-right: 10px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 80px;
            margin-top: 10px;
        }

        .result-area {
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 4px;
            color: var(--success-color);
            display: none;
            font-weight: bold;
        }

        .result-area.show { display: block; }

        .explanation {
            font-weight: normal;
            color: #333;
            margin-top: 5px;
            display: block;
        }

        /* Bottom Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-reset {
            background-color: #95a5a6;
            color: white;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-reset:hover { background-color: #7f8c8d; }
        .btn-submit:hover { background-color: #2980b9; }

</head>

    const itemsPerPage = 10;
    let currentPage = 1;
    const totalPages = Math.ceil(questions.length / itemsPerPage);

    function init() {
        renderPagination();
        showPage(1);
    }

    function renderPagination() {
        const pagDiv = document.getElementById('pagination');
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-btn ${i === 1 ? 'active' : ''}" onclick="showPage(${i})">第 ${i} 页</button>`;
        }
        pagDiv.innerHTML = html;
    }

    function showPage(pageNum) {
        currentPage = pageNum;

        // Update Buttons
        document.querySelectorAll('.page-btn').forEach((btn, idx) => {
            if (idx + 1 === pageNum) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        // Render Questions
        const start = (pageNum - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, questions.length);
        const pageQuestions = questions.slice(start, end);

        const quizArea = document.getElementById('quiz-area');
        quizArea.innerHTML = '';

        // 确保脚本末尾有这个辅助函数，否则 innerHTML 会因为特殊字符报错
        function escapeHtml(text) {
            if (!text) return "";
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
        }
        pageQuestions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${q.id}`;

            let html = `<div class="q-title">${q.id}. ${escapeHtml(q.q)}</div>`;
            if (q.code) {
                html += `<div class="code-block">${escapeHtml(q.code)}</div>`;
            }

            if (q.type === 'choice') {
                html += `<ul class="options-list">`;
                q.options.forEach((opt, idx) => {
                    const val = opt.charAt(0); // Assumes "A. ..."
                    html += `<li class="option-item">
                                <label style="width:100%; cursor:pointer;">
                                    <input type="radio" name="q-${q.id}" value="${val}"> ${escapeHtml(opt)}
                                </label>
                             </li>`;
                });
                html += `</ul>`;
            } else if (q.type === 'fill') {
                html += `<input type="text" id="input-${q.id}" placeholder="在此输入答案" style="width:100%; padding:8px;">`;
            } else if (q.type === 'tf') {
                html += `<ul class="options-list">
                            <li class="option-item"><label><input type="radio" name="q-${q.id}" value="T"> 正确 (True)</label></li>
                            <li class="option-item"><label><input type="radio" name="q-${q.id}" value="F"> 错误 (False)</label></li>
                         </ul>`;
            } else if (q.type === 'sa') {
                html += `<textarea id="input-${q.id}" placeholder="在此输入简答..."></textarea>`;
            }

            // Result Area (Hidden initially)
            html += `<div class="result-area" id="res-${q.id}">
                        <div id="res-txt-${q.id}"></div>
                        <span class="explanation">参考答案：${escapeHtml(q.answer)}</span>
                     </div>`;

            card.innerHTML = html;
            quizArea.appendChild(card);
        });

        // Scroll to top of questions
        window.scrollTo(0, 0);
    }

    // 第 455 行：修改函数开始
    // 第 455 行：函数开始
    function checkCurrentPage() {
        const start = (currentPage - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, questions.length);
        const pageQuestions = questions.slice(start, end);

        let correctCount = 0; // 【新增】用于统计本页答对的题数
        let objectiveCount = 0; // 【新增】用于统计本页客观题总数
        let firstErrorCard = null; // 【关键】用于记录本页第一个错误的 DOM 元素

        pageQuestions.forEach(q => {
            const resArea = document.getElementById(`res-${q.id}`);
            const resTxt = document.getElementById(`res-txt-${q.id}`);
            const card = document.getElementById(`card-${q.id}`);

            if (!resArea || !card) return; // 【防错】防止找不到元素导致脚本崩溃

            resArea.classList.add('show');
            card.classList.remove('correct', 'wrong');

            if (q.type === 'choice' || q.type === 'tf') {
                objectiveCount++; // 客观题总数+1
                const selected = document.querySelector(`input[name="q-${q.id}"]:checked`);
                const userVal = selected ? selected.value : null;

                if (userVal === q.answer) {
                    resTxt.innerText = "✅ 回答正确";
                    card.classList.add('correct');
                    correctCount++; // 正确数+1
                } else {
                    resTxt.innerText = "❌ 回答错误";
                    card.classList.add('wrong');
                    // 【跳转逻辑】如果是本页第一个错题，记录它的位置
                    if (!firstErrorCard) firstErrorCard = card;
                }
            } else {
                // 填空和简答题处理
                resTxt.innerText = "🔵 请对照参考答案自评";
                card.classList.add('correct');
            }
        });

        // 【新增】准确率弹窗提示
        const accuracy = objectiveCount > 0 ? ((correctCount / objectiveCount) * 100).toFixed(2) : 0;
        alert(`本页提交完毕！\n--------------------\n客观题准确率：${accuracy}%\n(对题数：${correctCount} / 总题数：${objectiveCount})`);

        // 【新增】平滑跳转到第一个错题
        if (firstErrorCard) {
            firstErrorCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
    function resetCurrentPage() {
        if (confirm("确定要重置本页所有答案吗？")) {
            // 通过重新调用渲染函数来刷新当前页面视图
            showPage(currentPage);
        }
    }

    // Initialize
    init();

</script>
